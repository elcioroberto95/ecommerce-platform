          - "Frontend Dockerfile + compose service (everything runs in Docker now)"
          - "Frontend registered in pnpm workspace lockfile (npm package-lock removed)"
          - "Frontend zod aligned to v4 (same as backend) - fixes resolver typing under pnpm"
          - "API base URL fixed: /api -> /api/v1"
          - "401 interceptor: only redirects when a token existed and not on /auth/* (fixes login loop)"
