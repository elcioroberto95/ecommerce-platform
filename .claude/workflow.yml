          - "AuthContext maps { accessToken, user }; register = POST /users + login"
          - "User type matches backend (role CUSTOMER|ADMIN)"
          - "Backend: Product.imageUrl column + migration; products responses include category {id,name,slug}"
          - "Backend: validateParams added to every /products/:id route (getById and related returned 500)"
