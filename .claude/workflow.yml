          - "forgot-password page calls nonexistent endpoint - decide: implement or hide"
          - "Frontend eslint config is broken (flat config + eslint 8 ignores src) - fix so lint runs"
          - "Ratings/reviews: not in the domain; UI removed. Backend sort=rating and ratingMin are dead code"

