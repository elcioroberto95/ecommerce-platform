        status: COMPLETE
        completion: 100%
        completed_date: "2026-09-09"
        duration: "0.5 day"
        assigned_agent: "backend-data-agent"
        started_date: "2026-09-09"

        implementation:
          - "apps/backend/src/database/seed.ts (compiled into dist, runs inside the container)"
          - "apps/backend/src/database/seed/catalog.ts (12 pt-BR categories + product templates)"
          - "apps/backend/src/database/seed/config.ts (SEED_PRODUCTS / SEED_USERS / SEED_ORDERS / SEED_RANDOM_SEED)"
          - "@faker-js/faker (pt_BR) as runtime dependency"
          - "Per-product price ranges (mousepad R$19-189, notebook gamer R$4.4k-16k)"
          - "O(k) distinct sampling instead of shuffling 10k products per order"

        verified:
          - "Ran in container: 10000 products, 2002 users, 3999 addresses, 613 carts, 10000 orders, 30173 items in 39s"
          - "Integrity: order.total = subtotal + shipping (0 mismatches); items sum = subtotal (0 mismatches)"
          - "No duplicate emails; every user has a default address; orders spread over 12 months"
          - "API: /categories 12, /products?category=&sort=price_desc, /products?search= all return seeded data"
          - "Login cliente@ecommerce.dev works"
          - "Old scripts/seed.ts removed (imported @prisma/client, incompatible with prisma-client generator)"

        run: "docker compose exec backend node dist/database/seed.js"

        scale_5m_run_2026_09_09:
          status: PARTIAL
          products: "5,000,000 in 554s (9k rows/s)"
          users_pass: "stopped by decision at 750,000 users / 1.5M addresses / 222k carts / 740k orders / 2.16M order items (4 GB)"
          why_stopped: "users pass ran at ~700 users/s (~8 rows each): generation and inserts do not overlap, and PK/unique btrees + FK checks vs 5M products exceeded 128MB shared_buffers. Full run would take 2.5h more; the SQL migration rebuild needed the container."
          next: "Overlap generation with inserts (pipeline), rerun with postgres shared_buffers=1GB (now in compose)"

        acceptance_criteria:
          - "Seed runs inside Docker without tsx"
          - "Default volume: 12 categories, 10000 products, 2002 users, ~4000 addresses, 10000 orders (~30k order items)"
          - "Deterministic (same SEED_RANDOM_SEED => same data)"
          - "Known accounts printed: admin@ecommerce.dev / cliente@ecommerce.dev"
          - "Products coherent with their category, pt-BR text"


      # STAGE 0.7: SQL MIGRATION (user request: "migrar tudo que é prisma pra query pura")
      sql_migration:
        name: "Replace Prisma Client with plain SQL (pg) + API-wide pagination"
        status: COMPLETE
        completion: 100%
        duration: "0.5 day"
        assigned_agent: "backend-data-agent"
        started_date: "2026-09-09"
        completed_date: "2026-09-09"

        decisions:
          - "Keep prisma CLI + schema.prisma + prisma/migrations as the migration tool (prisma migrate dev/deploy)"
          - "Runtime uses `pg` Pool directly: src/shared/database/pool.ts (query, queryOne, execute, withTransaction, buildUpdate, escapeLike)"
          - "Row types written by hand in src/shared/database/rows.ts (one interface per table)"
          - "Repositories keep method names and return shapes, so services/controllers barely changed"
          - "id and updatedAt had no DB default (ORM filled them): INSERTs use gen_random_uuid()::text and now()"
          - "NUMERIC stays string at the repository level; services already Number() it"
          - "LIKE wildcards in search are escaped (escapeLike) - the ORM did this implicitly"
          - "Every list endpoint returns { items, meta } and accepts page/limit; limit is capped at 250 (src/shared/schemas/pagination.ts)"

        done:
          - "pool.ts + rows.ts + schemas/pagination.ts"
          - "users, categories, products, cart, addresses, orders repositories in SQL"
          - "orders.createFromCart as an explicit transaction (stock guard UPDATE ... WHERE stock >= qty)"
          - "Pagination on /categories, /products, /products/:id/related, /users/me/addresses, /orders, /admin/orders"
          - "seed uses pg directly (execute with $n params)"
          - "@prisma/client, @prisma/adapter-pg removed; src/generated deleted; Dockerfile no longer runs prisma generate"
          - "Frontend: categories service reads the { items, meta } envelope"
          - "docker-compose: postgres tuned (shared_buffers=1GB, effective_cache_size=3GB, max_wal_size=4GB, work_mem=32MB)"

        verified:
          - "verify-api.sh ALL CHECKS PASSED against the container (5M products, 750k users, 740k orders)"
          - "categories paginated (12 total); limit=251 rejected on categories, products, related"
          - "products filters/sort/search (LIKE escaping) OK; detail 200, invalid id 400, unknown 404"
          - "users: create 201 (no password leaked), duplicate 409, login 200, wrong password 401, PATCH /users/me"
          - "cart: add merges quantity, update, over-stock 400, remove, clear"
          - "addresses: first is default, default reorders list, delete moves default to next"
          - "orders: empty cart 400; create decrements stock 13->11 and empties cart; list/detail; admin page 3 of 740k; customer 403"

        known_debt:
          - "products.sort=rating and ratingMin are accepted but do nothing (no ratings in the domain)"
          - "count(*) on every list is a full scan at millions of rows -> db_performance stage"

      # STAGE 0.8: SSR MIGRATION (user request: "vamos tirar esse monte de use client")
      ssr_migration:
        name: "Move the catalog from client-side fetching to Server Components"
        status: COMPLETE
        completion: 100%
        duration: "0.5 day"
        assigned_agent: "frontend-ssr-agent"
        started_date: "2026-09-10"
        completed_date: "2026-09-10"

        trigger: "Root layout carried 'use client', so every page fetched in the browser and the HTML shipped empty."

        decisions:
          - "Server fetches go through lib/server-api.ts with cache: 'no-store' (prices/stock move per request, and it keeps the route out of static generation)"
          - "API_INTERNAL_URL (http://backend:3000/api/v1) for server components; NEXT_PUBLIC_API_URL stays the browser-facing URL"
          - "Catalog filters live in the URL, not useState: the listing is shareable and the server can render it"
          - "No loading.tsx under /products: the Suspense boundary flushes the shell with 200 before notFound() runs, turning a missing product into a soft 404"
          - "Cart/auth stay client-side: the JWT is in localStorage, unreachable from the server renderer"
          - "react-query has no callers left; QueryClientProvider kept for the cart mutations stage"

        done:
          - "app/providers.tsx (QueryClient via useState + defaultOptions); root layout is a server component with metadata"
          - "Home, /products, /products/[id] are async server components"
          - "lib/product-search.ts parses/validates query params and builds hrefs; pagination is plain <Link>"
          - "ProductFilters (client) writes to the URL, debounced, with useTransition for pending feedback"
          - "generateMetadata per product; app/products/[id]/not-found.tsx"
          - "Client islands: AddToCartButton, AddToCartForm, ProductImage, CartBadge, HeaderUserMenu, HeaderMobileNav, useAddToCart"
          - "Header search is a native GET form to /products; cart badge shows the real item count"
          - "Deleted hooks/useProducts.ts and services/products.ts (dead after the move)"

        verified:
          - "Home HTML contains product names straight from the server (curl)"
          - "/products?inStock=true&sort=price_asc server-renders 'Showing 1-12 of 4.368.968 products'"
          - "Product detail <title> is the product name; unknown product returns HTTP 404"
          - "eslint + tsc --noEmit clean, 7 jest tests passing, docker compose build OK"

        known_debt:
          - "Container runs a production build: no Fast Refresh, no error overlay, no fetch logging - a dev compose override is missing"
          - "Duplicate @types/react in the workspace (18.3.31 and 19.2.17); use explicit ReactNode imports, never the global React namespace"
          - "No loading skeleton on /products: reintroduce as <Suspense> around the grid inside the page, never as loading.tsx"

      # STAGE 0.9: DEV EXPERIENCE (user request: "eu quero aprender debugar esse tipo de projeto")
      dev_experience:
        name: "Debuggable dev mode inside Docker"
        status: COMPLETE
        completion: 100%
        duration: "0.5 day"
        assigned_agent: "infra-agent"
        started_date: "2026-09-10"
        completed_date: "2026-09-10"

        trigger: "The container only ran the production build: no Fast Refresh, no error overlay, no fetch logging, no breakpoints."

        decisions:
          - "docker-compose.dev.yml, not docker-compose.override.yml: plain `docker compose up` must keep exercising the production build"
          - "Both Dockerfiles share a `deps` stage; `dev` and `builder` branch off it and the runner stage is untouched"
          - "Inspector flag travels in NODE_OPTIONS as a bare port: as a CLI flag fork() inherits execArgv and both processes fight over the port, and Next parseInt()s the value to derive the child's"
          - "socat republishes the forked Next server (127.0.0.1:9301) on 0.0.0.0:9229, since Node binds forked inspectors to localhost only"
          - "Polling watchers (WATCHPACK_POLLING / CHOKIDAR_USEPOLLING): Docker Desktop does not forward file events from the Windows host"

        done:
          - "docker-compose.dev.yml (next dev + tsx watch, source bind mounts, inspector ports 9229/9230)"
          - "dev target in apps/frontend/Dockerfile (with socat) and apps/backend/Dockerfile"
          - "next.config.js: logging.fetches.fullUrl"
          - ".vscode/launch.json: attach configs with localRoot/remoteRoot mapping + Chrome for client code"
          - ".dockerignore: **/.env* (apps/frontend/.env.local was landing in the image)"
          - "docs/DEBUGGING.md"

        verified:
          - "curl localhost:9229/json/list and localhost:9230/json/version answer from the host"
          - "Hot reload through the bind mount, both directions"
          - "Fetch log shows GET http://backend:3000/api/v1/... with cache status per render"
          - "Production build still SSRs the catalog (6 products in the HTML) and returns 404 on unknown product; 9229 closed"

        run:
          dev: "docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build"
          prod: "docker compose up --build -d"

