          - "Frontend: ProductCard uses imageUrl, category.name, stock, BRL prices, real add-to-cart (auth redirect)"
          - "Frontend: Home 'Featured' = newest in-stock products from the API, with error/empty states"
          - "Frontend: /products wired to the API (server-side search/category/price/stock/sort + pagination), mocks removed"
          - "Frontend: /products/[id] wired to the API + related products, mocks removed"

        remaining:
